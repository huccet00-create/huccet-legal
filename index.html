<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hüccet · Yasal</title>
<style>
  :root { --bg:#FBF3E7; --ink:#2A2622; --muted:#6E655B; --primary:#5E8B7E; --gold:#C9A227; --border:#EADFCB; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .brand { display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:22px; color:var(--primary); margin-bottom:8px; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--gold); }
  p { color:var(--muted); margin:0 0 32px; }
  a.card { display:block; text-decoration:none; color:var(--ink); background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin:12px 0; font-weight:600; }
  a.card span { display:block; font-weight:400; font-size:13.5px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span> Hüccet</div>
  <p>İslami yardımcı uygulama · Yasal belgeler</p>
  <a class="card" href="gizlilik.html">Gizlilik Politikası<span>Verilerinizi nasıl işlediğimiz</span></a>
  <a class="card" href="kosullar.html">Kullanım Koşulları<span>Uygulamayı kullanım şartları</span></a>
</div>
</body>
</html>
